# Open-Source 3D Printer Configuration File
# Kinematics: Cartesian (independent X, Y, Z axes)
# Max Velocity: 300 mm/s | Max Accel: 3000 mm/s^2 | Square Corner Velocity: 5.0 mm/s

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5.0

# Extruder & Hotend Settings
# Nozzle Diameter: 0.400 mm | Filament Diameter: 1.750 mm | Max Hotend Temp: 260 C

[extruder]
nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 260

# Heated Bed Settings
# Max Bed Temp: 110 C (suitable for PLA, PETG, and ABS calibration)

[heater_bed]
min_temp: 0
max_temp: 110
